---
- name: Assert usage of systemd as an init systemd
  ansible.builtin.assert:
    that: ansible_facts['service_mgr'] == 'systemd'
    msg: "This role only works with systemd"

- name: Check if traefik is installed
  ansible.builtin.stat:
    path: "{{ traefik_bin_dir }}/traefik"
  changed_when: false
  check_mode: false
  register: traefik_is_installed

- name: Check current traefik version
  ansible.builtin.command:
    argv:
      - "{{ traefik_bin_dir }}/traefik"
      - version
  changed_when: false
  failed_when: false
  register: traefik_current_version
  when: traefik_is_installed.stat.exists | bool

- name: Get latest Traefik release version
  ansible.builtin.uri:
    url: "{{ traefik_repo_url }}/releases/latest"
    method: HEAD
    return_content: false
    follow_redirects: false
    status_code: 302,200
  register: gh_redirect
  when: traefik_version == "latest"

- name: Extract version from Location header
  ansible.builtin.set_fact:
    traefik_version: "{{ (gh_redirect.location | regex_search('/releases/tag/(v[0-9].*)', '\\1'))[0] }}"
  when: traefik_version == "latest"
